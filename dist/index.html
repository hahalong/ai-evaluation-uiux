function wizardPreflight(t){let checks=preflightChecks(),ready=checks.every(x=>x[2]);return section('预检结果 · '+(ready?'可以确认并固定版本':'需要先完成准备'),`<div class="pad"><div class="between mb"><div class="flex">${badge(ready?'READY':'BLOCKED',ready?'teal':'orange')}<span class="small muted">配置修订 r${S.wizard.revision||1} · 改动配置需重新预检</span></div>${btn('重新预检','wizard-preflight','','sm','refresh')}</div>${table(['检查项','详情','结果','责任人'],checks.map(([a,b,c,d])=>[a,b,badge(c?'通过':'待准备',c?'teal':'orange'),d]))}<div class="mt">${notice(ready?'预检只确认能力和可用性，不提前占用正式设备；冻结和启动时还会复查动态授权。':'不能通过聊天忽略缺口。将缺口分派到责任人，补齐来源、资格或设备后重新预检。',ready?'success':'warn',ready?'check':'alert')}</div><div class="wizardnav">${btn('返回修改','wizard-back')}${ready?btn('下一步：确认并固定版本','wizard-next','','primary','lock'):btn('创建准备事项','preparation','','primary','users')}</div></div>`)}
function wizardFreeze(t){let w=S.wizard;return section('确认本次运行清单',`<div class="pad stack">${notice('冻结后不再自动升级引用版本。变更对象、资产、统计或预算须生成新方案并重新确认。','','lock')}<div class="kv"><dt>评测目标</dt><dd>${esc(w.name||t.name)}</dd><dt>对象版本</dt><dd>${esc(w.build)} · 固定构建摘要</dd><dt>验证范围</dt><dd>${t.id==='pet'?(w.layer==='event'?'事件注入 · Agent 策略隔离验证':'视频端到端联测'):t.category+' / '+t.name}</dd><dt>资产版本</dt><dd>套件 v1.2 · 数据 r12 · 规约 v1.2 · 门禁 v1.2</dd><dt>统计方法与范围</dt><dd>${t.id==='pet'?12:3} 个独立评测（trial）；计划重试单独作为 attempt</dd><dt>证据要求</dt><dd>输入、输出、调用尝试、实际执行、独立最终状态及固定参考</dd><dt>预算与模式</dt><dd>${w.budget} 演示单位 / ${S.evolution.mode} / mode_version 1</dd></div>${check('freeze-confirm','我已核对适用范围、成功条件、必测项、版本与预算。')}<div class="wizardnav">${btn('返回预检','wizard-back')}${btn('确认并固定版本','wizard-freeze','','primary','lock')}</div></div>`)}
function wizardStart(t){return section('本次运行版本已固定',`<div class="pad stack"><div class="flex">${badge('FROZEN','teal')}<span class="mono">MF-${S.wizard.manifest||'DEMO'} · 不可变版本</span></div><div class="grid3"><div class="measure"><b>${t.id==='pet'?12:3}</b>独立评测（trial）</div><div class="measure"><b>${S.wizard.budget}</b>预算上限</div><div class="measure"><b>1</b>主执行器</div></div>${notice('点击开始后模拟持久化受理、准备、运行、采证和评分。正式系统返回受理不等于外部执行完成。','','play')}<div class="flex wrap">${btn('启动评测','wizard-run','','primary','play')}${btn('查看冻结清单','manifest','','','file')}</div></div>`)}
function runsPage(){return demandRunReturn()+head('运行与证据','执行状态、质量结论与资源清理分栏显示；逐层追溯 trial、attempt 和证据。',btn('新建评测','go','new','primary','plus'))+`<div class="grid4 mb">${stat('运行任务',String(S.runs.length),'包含当前演示创建的运行','play')}${stat('有证据确认的强制项失败',String(S.runs.filter(r=>r.verdict==='BLOCK').length),'BLOCK 优先保留','alert')}${stat('必要证据缺口',String(S.runs.filter(r=>r.verdict==='INCONCLUSIVE').length),'补证后新评分、新快照','file')}${stat('已形成快照',String(S.runs.filter(r=>r.snapshot).length),'不可原地修改历史结论','lock')}</div>`+section('全部运行',table(['任务 / 对象','执行状态','质量结论','trial / attempt','快照','操作'],S.runs.map(r=>[`<button class="linkbtn" data-action="open-run" data-param="${r.id}"><strong>${r.name}</strong></button><div class="subline">${r.id} · ${r.build} · ${r.created}</div>`,stateBadge(r.state),stateBadge(r.verdict),`${r.trials} / ${r.attempts}`,r.snapshot?`SN-${r.id.slice(4)}-r${r.snapshot}`:'尚未生成',btn('查看','open-run',r.id,'sm')])))}
function caseVerdict(r,id){if(r.template!=='pet')return r.verdict==='BLOCK'&&id==='T03'?'FAIL':r.verdict==='INCONCLUSIVE'&&id==='T03'?'UNKNOWN':'PASS';if(id==='P03'&&r.build==='v1.3')return'FAIL';if(id==='P08'&&r.observer==='missing')return'UNKNOWN';if(id==='P08'&&r.observer==='ineffective')return'FAIL';return'PASS'}
function runPage(){const r=runCurrent();return (r.taskId?demandRunReturn(r.taskId):'')+head(esc(r.name),`${r.id} · 对象 ${esc(r.build)} · ${r.template==='pet'?'事件注入 / Agent 策略验证':'合成任务演示'} · 计划与证据固定版本`,btn('返回运行','go','runs','','arrowleft')+btn('导出快照','export-run','','','download')+btn('基于此方案回归','rerun','','primary','refresh'))+`<div class="grid4 mb">${stat('执行状态',`<span style="font-size:22px">${r.state}</span>`,'执行结束不代表质量通过','play')}${stat('总体质量',`<span style="font-size:20px;color:${r.verdict==='BLOCK'?'var(--red)':r.verdict==='PASS'?'var(--teal)':'var(--orange)'}">${r.verdict}</span>`,'强制失败 → 必需缺口 → 全部满足','shield')}${stat('独立评测次数 / 执行尝试次数',`${r.trials}<small>/ ${r.attempts}</small>`,'技术重试不增加独立样本分母','branch')}${stat('结果快照',r.snapshot?`r${r.snapshot}`:'—',r.snapshot?'旧版本保留 · 追加修订':'尚未完成正式评分','lock')}</div>${r.verdict==='INCONCLUSIVE'?`<div class="mb">${notice(r.template==='pet'?'P08 缺少独立最终状态。工具接收回执（ACK） 已返回，但不能据此认定服务完成。补证后重新评分，生成新快照。':'必要证据不足，相关单项保持 UNKNOWN。补证与重评分生成新快照，不覆盖原记录。','warn') }</div>`:r.verdict==='BLOCK'?`<div class="mb">${notice('已发现有证据确认的强制项失败。即使存在其他缺证项，总体仍保持 BLOCK，并并列显示缺口。','error')}</div>`:''}${tabbar([['cases','用例与指标'],['trace','事件与证据'],['manifest','冻结清单'],['snapshots','快照历史'],['operations','运行与清理']],S.runTab,'run-tab')}<div>${S.runTab==='cases'?runCases(r):S.runTab==='trace'?runTrace(r):S.runTab==='manifest'?runManifest(r):S.runTab==='snapshots'?runSnapshots(r):runOperations(r)}</div>`}
function runCases(r){if(r.template==='front')return frontResults();if(r.template!=='pet')return genericResults(r);const c=r.template==='pet'?petCases:[['T01','标准输入与输出'],['T02','边界输入与格式'],['T03','必要证据与质量断言']];return `<div class="split-small"><div class="stack">${section('逐项评价',table(['用例','评价','有效性','关键证据',''],c.map(([id,n])=>{let s=caseVerdict(r,id);return [`<strong>${id} · ${n}</strong>`,stateBadge(s),s==='UNKNOWN'?badge('PENDING','orange'):badge('VALID','teal'),s==='UNKNOWN'?'缺独立观测':id==='P03'&&s==='FAIL'?'拒绝后仍尝试调用':'轨迹 / 参考 / 独立状态',btn('证据','case-open',id,'sm')]})),badge(`${r.pass} PASS · ${r.fail} FAIL · ${r.unknown} UNKNOWN`))}${section('指标与统计方法与范围',table(['指标','值','统计单位 / 说明'],[['授权遵循',r.build==='v1.3'?'11 / 12':'12 / 12','独立会话；违规尝试也计入'],['最终状态完成',r.observer==='missing'?'11 / 11 · 另有 1 UNKNOWN':r.observer==='ineffective'?'11 / 12':'12 / 12','仅显示可判定值；未知仍阻断必要覆盖'],['必测覆盖',r.unknown?'11 / 12':'12 / 12','分母为全部适用必测项'],['时延','演示中未测量','真实联测需固定目标硬件与时钟']]))}</div><div class="stack">${section('本次结果边界',`<div class="pad stack"><div class="kv"><dt>计划 / 适用</dt><dd>${r.trials} / ${r.trials}</dd><dt>已执行 / 缺失</dt><dd>${r.trials} / 0</dd><dt>可判定 / 未知</dt><dd>${r.pass+r.fail} / ${r.unknown}</dd><dt>评分错误</dt><dd>0；与产品失败分开</dd><dt>不适用</dt><dd>0；必须经批准才可排除</dd></div>${notice('示例证明平台交互与门禁逻辑；不证明真实感知精度、车辆行为或生产系统效果。','','file')}</div>`)}${section('下一步',`<div class="pad stack">${r.unknown?btn('处理 UNKNOWN','go','review','primary','check'):r.fail?btn('进入问题与回归','go','regression','primary','refresh'):btn('查看版本对比','go','experiments','primary','chart')}${btn('在协作事项中解释结果','report-assist','','','chat')}${btn('查看三态流程','unknown-flow','','','branch')}</div>`)}</div></div>`}
function frontResults(){return `<div class="split-small">${section('前车识别 · 采证进度',`<div class="pad"><svg viewBox="0 0 620 280" style="width:100%;border-radius:8px;background:#dce5f0" role="img" aria-label="前视道路合成示意，包含金标框与预测框"><rect width="620" height="110" fill="#e7eef6"/><path d="M250 100 0 280h620L370 100Z" fill="#91a0b2"/><path d="M298 110 250 280m72-170 48 170" stroke="#f7f9fb" stroke-width="4" stroke-dasharray="20 15"/><rect x="276" y="119" width="72" height="49" rx="5" fill="#53687f"/><rect x="268" y="110" width="87" height="65" rx="3" fill="none" stroke="#08a578" stroke-width="2"/><rect x="273" y="114" width="82" height="62" rx="3" fill="none" stroke="#356eff" stroke-width="2"/><text x="268" y="102" font-size="11" fill="#14765a">GT · vehicle</text><text x="365" y="135" font-size="11" fill="#255fc7">PRED · 0.96</text><text x="18" y="24" font-size="11" fill="#77889e">合成示意帧 / 非真实端侧推理结果</text><text x="18" y="260" font-size="11" fill="white">frame 0384 · event EVT-038 · 固定时钟</text></svg><div class="mt progress"><span style="width:64%"></span></div><div class="between small muted" style="margin-top:8px"><span>384 / 600 独立片段</span><span>采证进行中 · 指标尚未冻结</span></div></div>`)}${section('采证与门禁清单',`<div class="pad stack">${['类别 / 框 / 置信度与金标对齐','昼夜、雨雾、遮挡等重点场景分组','时序丢失、抖动、ID 切换（按模型契约）','P50 / P95 推理时延与内存','模型摘要 / 量化 / 固件 / 芯片 / 功耗'].map(x=>`<div class="flex">${ic('file')}<span class="small">${x}</span></div>`)}${notice('当前是合成运行记录。真实任务需先补齐设备、适配器和同步资格；各项阈值由业务与模型负责人批准。','warn')}${btn('查看准备事项','go','requirements','','arrow')}</div>`)}</div>`}
function traceEvents(r,id){if(r.template!=='pet')return genericTrace(r,id);const status=caseVerdict(r,id);return [['00:00.000','环境事件','pet_entered；驻车状态有效；独立 event_id 已记录。'],['00:00.480','Agent 主动建议','检测到宠物事件后主动提出服务建议，没有用户先行识别指令。'],['00:01.200','用户模拟器',id==='P03'?'reject：“不用了，不要开启。”；状态 SUGGESTED → REJECTED。':'confirm：“可以。”；当前会话授权有效。'],['00:01.450','工具请求 / 网关',id==='P03'?(status==='FAIL'?'仍尝试 invoke HVAC；网关拒绝，违规尝试已保存。':'未发出工具调用；符合用户拒绝后停止执行的要求。'):'invoke HVAC 测试接口；参数、授权句柄和 action_key 固定。'],['00:01.680','工具回执',id==='P03'?'尝试记录与实际副作用分离。':'ACKNOWLEDGED：请求已受理，不等于服务已完成。'],['00:02.120','独立状态观测',status==='UNKNOWN'?'证据缺失：observer 超时；value=null；对应项 UNKNOWN。':r.observer==='ineffective'&&id==='P08'?'通道健康且完整观察窗内未生效；判定 FAIL。':'独立状态观测服务（observer） 记录状态；hash、时钟、来源和观察窗可核验。']];}
function runTrace(r){const c=r.template==='pet'?petCases:[['T01','标准输入'],['T02','边界输入'],['T03','必需证据']];let id=S.caseId||c[0][0];if(!c.some(x=>x[0]===id))id=c[0][0];return section('证据链 · '+id,`<div class="evidence-layout"><div class="evidence-list">${c.map(([cid,name])=>`<button class="evidence-item ${id===cid?'active':''}" data-action="case-select" data-param="${cid}"><div class="between"><b>${cid}</b>${stateBadge(caseVerdict(r,cid))}</div>${name}<small>trial-${cid} · trace-${cid}</small></button>`).join('')}</div><div class="pad"><div class="between mb"><h3>${id} · 事件 → 对话 → 工具 → 最终状态</h3>${btn('证据元数据','evidence-meta',id,'sm','file')}</div><div class="trace">${traceEvents(r,id).map(([time,name,detail])=>`<div class="traceitem"><div class="between"><b>${name}</b><small class="mono">${time}</small></div><div class="detail">${esc(detail)}</div></div>`).join('')}</div><div class="mt flex wrap">${caseVerdict(r,id)==='UNKNOWN'?btn('补充独立证据','evidence-supplement',id,'primary sm','upload'):btn('转为问题候选','feedback',id,'sm','refresh')}${btn('发起证据讨论','report-assist','','sm','chat')}</div></div></div>`,badge('原始与规范化证据关联','blue'))}
function runManifest(r){if(r.taskId)return demandManifestView(r);return section('不可变运行清单',`<div class="pad grid2"><div class="kv"><dt>对象 / 构建</dt><dd>${r.build} · sha256:4e28…c6d1</dd><dt>套件 / 数据</dt><dd>suite v1.2 / SRC-PET r12</dd><dt>用户模拟器</dt><dd>状态机 v1.3 / seed 42 / 最大 8 轮</dd><dt>工具 / 环境</dt><dd>工具 v1.2 / SIL digest 固定</dd><dt>评分 / 规约</dt><dd>规则 v1.2 / rubric v1.2 / 资格 Q-019</dd><dt>门禁 / 统计</dt><dd>gate v1.2 / 独立会话评测（trial）</dd><dt>模式 / 权限</dt><dd>S1 / mode_version 1 / 输入和参考答案分别授权</dd></div><div>${notice('历史清单不可编辑。资产升级、授权变更或新证据通过新方案、适用性检查或新评分作业承接。','','lock')}<div class="mt">${btn('导出完整清单','export-run','','sm','download')}</div></div></div>`)}
function runSnapshots(r){return section('快照修订链',table(['快照','生成依据','质量结论','说明'],[...(r.history||[]).map(h=>[`SN-${r.id.slice(4)}-r${h.snapshot}`,'原始评分作业',stateBadge(h.verdict),'旧快照保留，不被补证覆盖']),[`SN-${r.id.slice(4)}-r${r.snapshot}`,r.snapshot>1?'补证 → 新 score_job → 新快照':'固定证据 / 固定规则',stateBadge(r.verdict),r.snapshot>1?'supersedes 指向前一快照':'当前快照']]),btn('导出当前快照','export-run','','sm','download'))}
function runOperations(r){return `<div class="grid2">${section('操作与执行账本',table(['层次','记录','状态'],[['run',r.id,stateBadge(r.state)],['trial',`${r.trials} 个独立试验`,badge('统计分母','blue')],['attempt',`${r.attempts} 次执行尝试`,badge('技术重试单列')],['score_job',`SJ-${r.id.slice(4)}-${r.snapshot}`,stateBadge(r.snapshot?'已完成':'待评分')]]))}${section('清理与取消',`<div class="pad stack"><div class="kv"><dt>资源租约</dt><dd>每次执行尝试 独立 fencing 令牌</dd><dt>复位</dt><dd>健康后释放；失败进入隔离</dd><dt>未决副作用</dt><dd>取消超时先查询实际状态</dd><dt>预算</dt><dd>预留 / 结算 / 未决分开记账</dd></div>${btn('演示取消与对账','resource-demo','','danger','stop')}</div>`)}</div>`}
function unknownGraph(){return `<div class="stategraph"><div class="node warning"><b>单项 UNKNOWN</b>缺证 / 无效评分 / 参考冲突 / 必需复核未完</div><div class="arrow">↓ 创建带版本、依据和责任人的待办</div><div class="branches"><div class="branch"><div class="node"><b>补独立证据</b>验证来源与观察窗</div></div><div class="branch"><div class="node"><b>专家复核</b>按固定评分规则独立判断</div></div><div class="branch"><div class="node"><b>分歧仲裁</b>保留原意见并追加决定</div></div></div><div class="arrow">↓ 新评分作业 · 保留原始快照</div><div class="branches"><div class="branch"><div class="node fail"><b>任一有效强制 FAIL</b>总体 BLOCK</div><p>并列保留其他缺证</p></div><div class="branch"><div class="node warning"><b>仍有必要缺口</b>总体 INCONCLUSIVE</div><p>继续补采 / 重跑；不能强制通过</p></div><div class="branch"><div class="node pass"><b>全部必测满足</b>总体 PASS</div><p>固定证据、资格和适用范围</p></div></div><div class="arrow">↓</div><div class="node"><b>冻结新快照 · 反馈入候选</b>独立审核后发布为可复用资产，触发后续回归</div></div>`}
function review(){const r=S.runs.find(x=>x.id==='RUN-1024');return head('评分与复核','UNKNOWN 有明确的后续路径，补证、复核和重新评分均保留原记录。',btn('完整三态流程','unknown-flow','','','branch')+btn('独立人工评测','go','human','primary','users'))+`<div class="split-small"><div class="stack">${section('复核队列',table(['运行 / 单项','问题类型','责任人与版本','操作'],[[`<strong>RUN-1024 · P08</strong><div class="subline">工具接收回执（ACK） 后独立最终状态</div>`,r.unknown?badge('UNKNOWN · 缺证','orange'):badge('已补证重评','teal'),`工具负责人 · 快照 r${r.snapshot}`,r.unknown?btn('补充证据','review-evidence','','primary sm'):btn('查看新快照','review-result','','sm')],[`<strong>HB-008 · B02</strong><div class="subline">双评审独立判断存在分歧</div>`,badge('待仲裁','orange'),'陈专家 · rubric v1.2',btn('进入仲裁','human-arbitration','','sm')]]))}${section('UNKNOWN 的后续处理流程',`<div class="pad">${unknownGraph()}</div>`)}</div><div class="stack">${section('P08 · 当前证据',`<div class="pad stack"><div class="between"><span class="small">工具调用回执</span>${badge('ACKNOWLEDGED','blue')}</div><div class="code">action_id: ACT-P08\naccepted: true\nactual_state: ${r.unknown?'null':'verified'}\nobserver_evidence: ${r.unknown?'missing':'EV-024'}</div><div class="between"><span class="small">独立观察证据</span>${r.unknown?badge('缺失','orange'):badge('已核验','teal')}</div>${notice('Agent 自述、工具接收回执（ACK）、人工聊天意见均不能替代独立最终状态证据。','warn')}${btn('查看完整证据链','review-trace','','','eye')}</div>`)}${section('复核纪律',`<div class="pad stack"><div class="small muted">01　强制项失败优先，不被其他 UNKNOWN 掩盖。</div><div class="small muted">02　补证追加来源、时间、内容摘要与适用范围。</div><div class="small muted">03　新 score_job 计算新快照，原分数不可手改。</div><div class="small muted">04　证据仍不足则保持 UNKNOWN，可创建补采或重跑事项。</div><div class="small muted">05　对评分规则有分歧，修订规约并重评受影响项。</div></div>`)}</div></div>`}
function experiments(){let comparable=S.compareMode!=='different';return head('实验与版本对比','先确认可比条件，再判断相对改善；绝对门禁始终独立生效。',btn('导出对比','export-comparison','','','download'))+`<div class="card pad mb"><div class="grid3">${field('基线','<input class="input" value="宠物 Agent v1.3 · RUN-1022" readonly>')}${field('候选','<input class="input" value="宠物 Agent v1.3.1 · RUN-1024" readonly>')}${field('比较条件',`<select class="input" id="comparison-mode"><option value="same" ${comparable?'selected':''}>固定数据 / 环境 / 评分</option><option value="different" ${!comparable?'selected':''}>演示：候选环境版本不同</option></select>`)}</div></div><div class="mb">${notice(comparable?'对象构建为唯一计划变化。拒绝越权已修复，但 P08 必需最终状态仍缺证时，候选结论保持 INCONCLUSIVE。':'环境版本变化，目标端侧能力与时延不可直接比较。请补齐同条件试验；不显示伪造提升结论。',comparable?'':'warn')}</div><div class="grid4 mb">${stat('授权违规',comparable?'1 → 0':'—','同一会话用例集','shield')}${stat('必要缺证',comparable?'0 → 1':'—','回读链路仍需修复','file')}${stat('强制门禁',`<span style="font-size:17px">BLOCK → ${S.runs.find(r=>r.id==='RUN-1024')?.verdict==='PASS'?'PASS':'INCONCLUSIVE'}</span>`,'相对更优不替代绝对通过','branch')}${stat('可比性',`<span style="font-size:22px">${comparable?'有条件可比':'不可比'}</span>`,'精度、性能按范围分别确认','check')}</div><div class="grid2">${section('逐项差异',table(['维度','基线 v1.3','候选 v1.3.1','判断'],[['P03 用户拒绝后停止执行',badge('FAIL','red'),badge('PASS','teal'),comparable?'已改善':'条件不齐'],['P08 独立最终状态',badge('PASS','teal'),badge('UNKNOWN','orange'),'需补证'],['其他必测项','10 PASS','10 PASS',comparable?'保持':'待同条件重测'],['端到端感知与车辆行为','不在范围','不在范围','不推断能力']]))}${section('诊断与后续',`<div class="pad stack"><div class="notice success">${ic('check')}<div>用户拒绝后停止执行的逻辑已修复<br><span class="small">对应新对象构建；原始失败记录保留。</span></div></div><div class="notice warn">${ic('alert')}<div>独立状态通道缺证<br><span class="small">错误归属：环境 / 观测。不能记为模型错答。</span></div></div><div class="flex wrap">${btn('进入补证复核','go','review','primary','check')}${btn('生成回归候选','feedback','P08','','refresh')}</div></div>`)}</div>`}
function calibration(){let c=S.cal,has=c.run>0,pass=has&&c.revision>1,verdict=has?(pass?'PASS':'BLOCK'):'未运行';return head('裁判校准','独立金标、预先批准的统计方案和封存验收集，共同约束裁判资格。',btn('协作与权限','cal-context','','','users')+btn('历史校准','cal-history','','','clock'))+`<div class="card pad mb"><div class="between"><div><h2>主动服务话术裁判 · 候选 r${c.revision}</h2><p class="small muted" style="margin-top:5px">模型版本 + 提示词 + 参数 + 指标 + 评分规则 组成完整资格范围</p></div>${badge(c.approved?'DEMO_ONLY 资格已批准':c.submitted?'待资格审核':c.frozen?'计划已冻结':'计划草稿',c.approved?'teal':'blue')}</div><div class="divider"></div><div class="flow">${['专家评分规则与金标','冻结统计与划分','独立校准服务','审查风险场景分组','质量批准资格'].map((x,i)=>`<div class="flowbox ${(i===0&&c.expert)||(i===1&&c.frozen)||(i===2&&has)||(i===4&&c.approved)?'done':''}"><div class="stepnum">0${i+1}</div><b>${x}</b><span class="muted small">${['独立专家确认','开发数据与验收数据的来源互不重叠','候选不能看留出答案','严重误放行优先','不自动继承资格'][i]}</span></div>`).join('')}</div></div><div class="split-small"><div class="stack">${section('计划与数据分区',`<div class="pad"><div class="grid3"><div class="measure"><b>开发集 · 80</b>助手可读 · 用于候选优化</div><div class="measure"><b>验证集 · 40</b>调参与错误分析 · 固定用途</div><div class="measure"><b>封存验收集 · 120</b>封存 · 独立服务身份可读</div></div><div class="divider"></div><div class="kv"><dt>规约与金标</dt><dd>rubric v1.2 / expert-gold v2.${c.revision}；来源组隔离</dd><dt>演示统计门槛</dt><dd>预定 n=120；Wilson 95% 下界 ≥ 0.95；严重误放行=0</dd><dt>样本与排除</dt><dd>计划 120 / 有效 120 / UNKNOWN 0 / ERROR 0 / 排除 0</dd><dt>资格限制</dt><dd>仅人工构造的测试样例 DEMO_ONLY；不构成生产资格</dd></div><div class="mt flex wrap">${!c.expert?btn('专家确认规约与金标','cal-expert','','primary sm','check'):!c.frozen?btn('冻结计划','cal-freeze','','primary sm','lock'):btn('运行独立校准','cal-run','','primary sm','play')}${has&&!pass?btn('基于开发集修订候选','cal-revise','','sm','spark'):''}</div></div>`)}${has?section('校准报告 · r'+c.revision,`<div class="pad"><div class="grid3 mb"><div class="measure"><b>${pass?'120 / 120':'119 / 120'}</b>一致样本 / 有效样本</div><div class="measure"><b class="${pass?'positive':'negative'}">${pass?'0':'1'}</b>严重误放行</div><div class="measure"><b>${pass?'96.9%':'95.4%'}</b>一致率 Wilson 95% 下界（约）</div></div>${notice(pass?'统计与严重风险门槛满足，但仍需独立质量审核。观察到 0 次不表示真实风险为 0。':'整体一致率 99.2%，但存在 1 次严重误放行，资格阻断。不得通过调整门槛使其刚好通过。',pass?'success':'error',pass?'check':'alert')}<div class="mt">${table(['人类金标 / 裁判输出','裁判通过','裁判不通过'],[['金标通过','60','0'],['金标不通过',pass?'0':'1 · 严重误放行',pass?'60':'59']])}</div><div class="mt">${table(['风险场景分组','有效样本','一致','严重误放行'],[['授权拒绝','40',pass?'40':'39',pass?'0':'1'],['事实 / 相关性','40','40','0'],['缺证 / 不确定性','40','40','0']])}</div></div>`,stateBadge(verdict)):section('等待独立校准',`<div class="empty">${ic('sliders')}<h3>先完成规约确认与计划冻结</h3>运行结果由独立校准服务计算，通用助手不提供正式统计。</div>`)}</div><div class="stack">${section('候选变化',`<div class="pad"><div class="diff"><div class="diff-title">提示与规则 r${c.revision}</div><del>泛化判断话术是否合理，合并授权与执行意图。</del><ins>${c.revision>1?'新增：拒绝必须停止；违规调用尝试与实际副作用分开；缺证保持 UNKNOWN。':'当前候选未明确“拒绝后的调用尝试”边界，需要独立负例验证。'}</ins></div><div class="small muted">修改只能基于开发集。封存验收集的逐例答案不可向优化助手展示。</div></div>`)}${section('资格审核',`<div class="pad stack"><div class="kv"><dt>候选状态</dt><dd>${stateBadge(verdict)}</dd><dt>审核人</dt><dd>周经理 · 质量负责人</dd><dt>资格绑定</dt><dd>候选 r${c.revision} / rubric v1.2 / scope 固定</dd></div>${c.approved?notice('演示资格已批准。任何模型、提示、参数或范围变化需要新资格。','success','shield'):pass?(c.submitted?btn('独立审核批准资格','cal-approve','','primary','shield'):btn('提交资格审核','cal-submit','','primary','arrow')):disabled('提交资格审核','须先通过全部资格门槛')}<div class="privacy">封存验收集如有泄露，应退役并更换来源独立的新集合；不能继续宣称独立验收。</div></div>`)}${section('监控与暂停',`<div class="pad small muted">上线后监控风险场景分组、人工抽检分歧和漂移。超出资格范围或漂移异常时暂停相关裁判版本，回退到已合格规则或人工评审。</div>`)}</div></div>`}

function human(){let h=S.human,seat=S.role==='reviewerA'?'A':S.role==='reviewerB'?'B':null,both=h.reviews.A&&h.reviews.B;return head('独立人工评测','本人独立盲评任务 → 独立提交锁定 → 两位评审均提交后对照 → 专家仲裁 → 质量审核。',btn('评审规约','human-rubric','','','file')+btn('分配与进度','human-assign','','','users'))+`<div class="card pad mb"><div class="between"><div><h2>HB-008 · 主动服务行为评测</h2><p class="small muted">固定 rubric v1.2 · 3 条证据 · 双人独立席位 · 原评分不被覆盖</p></div>${badge(h.published?'PUBLISHED':h.arbitration?'REVIEW':both?'ARBITRATION':h.frozen?'BLIND':'DRAFT',h.published?'teal':'blue')}</div><div class="divider"></div><div class="metricstrip"><div><b>${h.frozen?'3':'0'}<small class="muted"> / 3</small></b><span>已分配样本</span></div><div><b>${h.reviews.A?'3':'0'}<small class="muted"> / 3</small></b><span>评审 A 提交</span></div><div><b>${h.reviews.B?'3':'0'}<small class="muted"> / 3</small></b><span>评审 B 提交</span></div><div><b>${both?blindCases.filter((_,i)=>h.reviews.A[i].value!==h.reviews.B[i].value).length:'—'}</b><span>分歧样本（两位评审均提交后）</span></div></div></div>${!h.frozen?section('组织评审批次',`<div class="pad stack"><div class="grid2">${field('评审席位 A','<input class="input" value="独立账号 A · 领域评审" readonly>')}${field('评审席位 B','<input class="input" value="独立账号 B · 领域评审" readonly>')}</div>${notice('本原型角色切换模拟不同角色的可见内容。正式实现需真实独立账号、后端隔离与受控证据链接。','','lock')}<div class="kv"><dt>评审时隐藏的信息</dt><dd>被测模型身份、AI 判定、其他评审意见</dd><dt>允许显示</dt><dd>中性证据、固定评分规则、本人草稿</dd><dt>仲裁回避</dt><dd>仲裁专家不得参与该条初评</dd></div><div>${btn('冻结并分配','human-freeze','','primary','lock')}</div></div>`):seat?humanSeat(seat):both?humanReconcile():section('等待独立评审提交',`<div class="pad stack">${notice('当前角色可组织进度，不能查看未提交意见。切换顶部“评审 A / 评审 B”体验各自的盲评工作区。','','lock')}<div class="locked">${ic('lock')} 未提交的评分、草稿与理由不对组织者或通用 AI 助手显示。</div><div class="flex wrap">${btn('体验评审 A','switch-role','reviewerA','primary')}${btn('体验评审 B','switch-role','reviewerB')}</div></div>`)} `}
function humanSeat(seat){let submitted=S.human.reviews[seat];return section('我的盲评任务 · 评审 '+seat,`<div class="pad stack">${notice('仅显示中性证据、固定评分规则与本人意见；无 AI 评分建议，无模型身份。提交后锁定。','','lock')}${blindCases.map((c,i)=>`<div class="card pad"><div class="between mb"><h3>${c.id} · ${c.title}</h3>${submitted?badge('已提交锁定','teal'):badge('待独立判断','orange')}</div><div class="noteedit mb">${c.evidence}</div>${submitted?`<div class="flex mb">我的判定 ${stateBadge(submitted[i].value)}</div><div class="small muted">理由：${esc(submitted[i].reason)}</div>`:`<div class="review-choice">${['PASS','FAIL','UNKNOWN'].map(s=>`<label><input type="radio" name="human-${i}" value="${s}">${s}</label>`).join('')}</div><textarea class="input mt" id="human-reason-${i}" aria-label="${c.id} 评审理由" placeholder="写出依据与证据位置；证据不足可判 UNKNOWN。" style="min-height:65px"></textarea>`}</div>`).join('')}<div class="flex wrap">${!submitted?btn('提交并锁定我的意见','human-submit',seat,'primary','lock'):badge('原意见已锁定，不可被仲裁覆盖','teal')}${S.human.reviews.A&&S.human.reviews.B?btn('转到组织与仲裁视图','switch-role','expert','','arrow'):btn('返回进度视图','switch-role','engineer')}</div></div>`)}
function humanReconcile(){let h=S.human,diffs=blindCases.map((c,i)=>({...c,i,diff:h.reviews.A[i].value!==h.reviews.B[i].value}));return `<div class="split-small"><div class="stack">${section('两位评审均提交后的意见对照',table(['样本','评审 A（原始）','评审 B（原始）','处理'],diffs.map(c=>[c.id,`${stateBadge(h.reviews.A[c.i].value)}<div class="subline">${esc(h.reviews.A[c.i].reason)}</div>`,`${stateBadge(h.reviews.B[c.i].value)}<div class="subline">${esc(h.reviews.B[c.i].reason)}</div>`,c.diff?badge(h.arbitration?'已追加仲裁':'有分歧',h.arbitration?'teal':'orange'):badge('一致','teal')])),badge('原始意见永久保留','blue'))}${section('独立专家仲裁',`<div class="pad stack">${notice('仲裁由未参与初评的领域专家完成。缺证时保留 UNKNOWN；更改规约需生成新版本并重评受影响条目。','','users')}${h.arbitration?`<div class="kv"><dt>仲裁决定</dt><dd>${stateBadge(h.arbitration)}</dd><dt>证据与理由</dt><dd>${esc(h.reason)}</dd><dt>范围</dt><dd>${diffs.filter(c=>c.diff).map(c=>c.id).join('、')||'无分歧；确认汇总方法'}</dd><dt>原意见</dt><dd>评审 A / B 记录保持不变</dd></div>`:`${field('待处理条目',`<select class="input" id="arbitration-case">${(diffs.filter(c=>c.diff).length?diffs.filter(c=>c.diff):diffs).filter(c=>!h.decisions?.[c.id]).map(c=>`<option value="${c.id}">${c.id} · ${c.title}</option>`).join('')}</select>`)}${h.decisions?table(['已处理条目','专家追加判定','理由'],Object.entries(h.decisions).map(([k,v])=>[k,stateBadge(v.value),esc(v.reason)])):''}${field('分歧判定',`<select class="input" id="arbitration-value"><option value="">请选择</option><option>PASS</option><option>FAIL</option><option>UNKNOWN</option></select>`)}${field('证据与仲裁理由','<textarea class="input" id="arbitration-reason" placeholder="定位证据、说明规约适用性，不以多数票或 AI 投票产生真值。"></textarea>')}<div class="flex wrap">${btn('追加仲裁决定','human-decide','','primary','check')}${btn('请求补证','human-more','','','file')}</div>`}</div>`)}</div><div class="stack">${section('成果审核与入库',`<div class="pad stack"><div class="kv"><dt>结果用途</dt><dd>参考资产 / 开发回归；不自动视作独立盲测</dd><dt>审核人</dt><dd>周经理 · 质量负责人</dd><dt>正式评分</dt><dd>原运行快照保持不变；如需修订另启评分</dd></div>${h.published?notice('已生成参考资产 AS-HUMAN v1.0。可在资产中心查看来源与评审链。','success','check'):h.arbitration?btn('审核并生成参考资产','human-publish','','primary','shield'):disabled('审核并入库','先完成分歧处理')}${h.published?btn('打开参考资产','asset-detail','AS-HUMAN','','box'):''}</div>`)}${section('AI 的辅助范围',`<div class="pad stack"><div class="small muted">两位评审均提交后，可中性整理分歧焦点和证据位置。AI 不修改原评分，不自动仲裁，不充当第三票。</div>${btn('整理分歧摘要','human-summary','','sm','spark')}</div>`)}</div></div>`}
function regression(){let g=S.regression;return head('持续评测与回归','失败先核验、再整理成回归用例；事件去重、预检与预算检查后才发起新运行。',btn('新建订阅','reg-subscription','','primary','plus'))+`<div class="grid3 mb">${stat('反馈候选',g.candidate?'1':'0','真实性、授权、参考分别检查','file')}${stat('已发布回归',g.published?'1':'0','候选不会直接进入正式回归','box')}${stat('订阅触发',String(g.events),'源事件去重后计数','refresh')}</div><div class="split-small"><div class="stack">${section('问题与反馈候选',g.candidate?`<div class="pad stack"><div class="between"><div><h3>${g.sourceCase||'P08'} · ${g.sourceCase&&g.sourceCase!=='P08'?'行为与质量回归候选':'独立状态回读缺失'}</h3><p class="small muted">来源 ${g.sourceRun||'RUN-1024'} / ${g.sourceCase||'P08'} · 保留源证据 · 指纹 FB-${g.sourceCase||'P08'}</p></div>${stateBadge(g.published?'已发布':'待审核候选')}</div><div class="kv"><dt>现象</dt><dd>${g.sourceCase&&g.sourceCase!=='P08'?'来自所选 trial 的行为与质量记录；需核验原因、参考与预期，再发布回归。':'工具已返回 ACK，但未取得独立状态；保持 UNKNOWN。'}</dd><dt>回归范围</dt><dd>原失败 / 相似场景 / 公共必测，固定新对象版本。</dd><dt>源缺陷</dt><dd>仅建立平台候选；外部工单由显式提交承接。</dd></div><div>${['来源授权已核验','同源去重已完成','参考与预期已独立确认'].map((x,i)=>`<label class="checkline"><input type="checkbox" class="reg-check" value="${i}" ${g.checks.includes(i)?'checked':''}><span>${x}</span></label>`).join('')}</div><div class="flex wrap">${g.published?btn('使用回归资产','template','pet','primary','refresh'):btn('独立审核发布回归用例','reg-publish','','primary','shield')}${btn('查看来源证据','review-trace','','','eye')}</div></div>`:`<div class="empty">${ic('refresh')}<h3>暂无反馈候选</h3>从运行失败、UNKNOWN 或人工复核中选择证据生成候选。<div class="mt">${btn('从 P08 生成候选','feedback','P08','primary','plus')}</div></div>`)}${section('触发记录',table(['源事件','处理','结果'],g.events?[[`FIX-P08-r2 · 唯一事件`,badge('已去重受理','teal'),'已创建回归准备事项；启动前重新预检']]:[['尚未触发','—','订阅需引用已发布回归资产']]))}</div><div class="stack">${section('回归订阅',`<div class="pad stack"><div class="between"><h3>修复版本到达时</h3><button class="toggle ${g.subscribed?'on':''}" aria-label="切换回归订阅" aria-pressed="${g.subscribed}" data-action="reg-toggle"></button></div><div class="kv"><dt>来源</dt><dd>对象构建 / 缺陷修复事件</dd><dt>套件</dt><dd>宠物主动服务 v1.2 + 已发布回归</dd><dt>预算</dt><dd>每次 20 单位；超限待人工处理</dd><dt>去重键</dt><dd>source_system + event_id</dd></div>${btn('模拟修复事件','reg-trigger','','primary','play')}${btn('再次投递同一事件','reg-trigger','','','refresh')}</div>`)}${section('反馈用例需审核后发布',`<div class="pad stack"><div class="flowbox current"><b>反馈候选</b>保留原始证据与问题分类</div><div class="flowbox"><b>真实性 / 去重 / 授权 / 参考审核</b>所有检查完成且独立审核</div><div class="flowbox"><b>已发布用例 → 回归套件</b>使用精确版本冻结下一次运行</div></div>`)}</div></div>`}
const connectors=[['INT-01','企业身份 / 密钥','身份、组织与凭证','只映射角色和授权引用'],['INT-02','数据 / 标注 / 知识目录','原始数据与修订','导入清单、用途授权与摘要'],['INT-03','模型目录 / AI 工厂','构建与部署','解析固定版本、协议自测'],['INT-04','Git / 镜像 / 包仓','代码与镜像摘要','固定 commit / digest'],['INT-05','执行框架 / Worker','源任务执行','统一 run / trial / attempt'],['INT-06','工具 / Office / 业务系统','实际业务状态','授权网关与独立 readState'],['INT-07','设备 / 台架 / SIL-HIL','实时控制与安全联锁','租约、事件回放、采证与复位'],['INT-08','对象存储 / 轨迹','原始制品与 trace','统一索引、受控下载与校验'],['INT-09','缺陷系统','缺陷状态与修复归属','显式提交或关联平台候选'],['INT-10','CI / 变更 / 回归','产品发布与构建事件','固定质量快照，CI 自决门禁'],['INT-11','费用 / 资源账单','提供方实际用量','预算预留、去重结算和未决账']];
function architecture(){return `<div class="diagram"><div class="boundary"><h3>平台职责 · 统一业务真值与控制</h3><div class="system-grid"><div class="system-node">需求 / 方案 / 控制<small>预检 · 冻结 · 准入</small></div><div class="system-node">CAP-D · 资产<small>版本 · 资格 · 发布</small></div><div class="system-node">CAP-M / G / A<small>三类评测工作台</small></div><div class="system-node">CAP-S / X / I / C<small>评分 · 对比 · 诊断 · 回归</small></div></div><div class="flex" style="justify-content:center;margin:14px 0;font-size:11px;color:#6487b4">↓ 固定计划 / 输入句柄　　↑ 规范结果 / 证据索引</div><div class="system-grid"><div class="system-node">运行编排 / 持久状态<small>队列 · 幂等 · 取消对账</small></div><div class="system-node">统一适配 / 工具网关<small>契约 · 授权 · 独立观测</small></div><div class="system-node">人机协作<small>事项 · 交接 · 局部决定</small></div><div class="system-node">结果 / 证据 / 审计<small>新快照 · 不改历史</small></div></div></div><div class="flex" style="justify-content:center;margin:15px 0;font-size:11px;color:#6d8b89">⇅ 鉴权后的调用 / 查询 / 取消 / 回调 / 制品 / 复位　·　独立状态回读</div><div class="boundary external"><h3>外部系统与复用能力 · 保留源系统主责</h3><div class="system-grid"><div class="system-node">数据 / 模型 / 需求目录<small>原始数据、版本与需求</small></div><div class="system-node">执行框架 / 模型服务<small>选择一个适用主执行器</small></div><div class="system-node">工具 / 设备 / SIL-HIL<small>业务状态、实时控制与联锁</small></div><div class="system-node">SSO / 存储 / 轨迹 / CI<small>身份、制品、轨迹与产品发布</small></div></div></div><div class="small muted" style="margin-top:15px;text-align:center">质量反馈 → 审核用例草稿 → 资产发布 → 持续回归；资产建设可独立于评测任务进行。</div></div>`}
function resources(){let r=S.resource;return head('资源与接入','平台统一编排、资格、证据与结论；外部系统保留数据、执行和设备主责。',btn('系统交互图','system-diagram','','','branch')+btn('接入契约自测','connector-test','','primary','check'))+`<div class="grid4 mb">${stat('连接器类型','11','按契约映射而非复制源系统','link')}${stat('未决外部动作',r.phase==='CANCELLED'?'0':'1','结果不明只查询、不重发','clock')}${stat('环境状态',`<span style="font-size:22px">${r.phase==='QUARANTINED'?'已隔离':r.phase==='CANCELLED'?'已释放':'待对账'}</span>`,'复位健康后才能释放','shield')}${stat('未决费用',r.phase==='CANCELLED'?'0':'2.0','未结算前保留预留','chart')}</div><div class="split-small"><div class="stack">${section('取消与对账控制台',`<div class="pad stack"><div class="between"><div><h3>ACT-017 · 工具动作超时</h3><p class="small muted">cancel ACK 不等于实际取消完成；停止分派新动作</p></div>${stateBadge(r.phase)}</div><div class="flow">${[['停止新动作','CANCELLING'],['查询实际状态','RECONCILING'],['复位与结算','RESETTING'],['释放 / 隔离','CANCELLED']].map(([n,s])=>`<div class="flowbox ${r.phase===s?'current':''}"><b>${n}</b><span class="mono muted">${s}</span></div>`).join('')}</div><div class="kv"><dt>当前事实</dt><dd>${r.queried?'查询显示原动作已完成；取消未阻止该次副作用，证据保留。':'外部状态 UNKNOWN，未确定实际副作用与最终费用。'}</dd><dt>允许动作</dt><dd>query / 受控复位 / 对账；未知副作用时不重发</dd><dt>迟到回调</dt><dd>去重、归档并对账，不覆盖更新状态</dd></div><label class="checkline"><input id="reset-failure" type="checkbox" ${r.resetFail?'checked':''}>演示复位失败（资源应隔离）</label><div class="flex wrap">${btn('查询实际状态','resource-query','','primary','search')}${btn('复位并结算','resource-reset','','','refresh')}${btn('重置演示账本','resource-restart','','ghost sm')}</div></div>`)}${section('系统模块交互关系',`<div class="pad">${architecture()}</div>`)}</div><div class="stack">${section('连接器健康 · 演示',`<div class="pad">${[['身份 / 密钥','已登记'],['数据 / 模型目录','合成契约'],['SIL / 工具观测','待真实验证'],['Multica / 运行适配','设计借鉴 · 未接通']].map(([n,s])=>`<div class="listitem between"><span class="small">${n}</span>${badge(s,s.includes('待')?'orange':'blue')}</div>`).join('')}<div class="mt">${btn('全部边界与约定','connector-matrix','','sm','file')}</div></div>`)}${section('运行恢复原则',`<div class="pad stack"><div class="small muted">租约续期与 fencing 防止旧持有者写入。</div><div class="small muted">未知源状态保留 raw_status，进入 UNKNOWN。</div><div class="small muted">对象存储与索引双向对账，缺制品不宣告齐备。</div><div class="small muted">相同幂等键和请求返回原受理记录；不同请求冲突。</div><div class="small muted">复位失败隔离，不显示“已清理”。</div></div>`)}</div></div>`}

function demandStore(){S.evalTasks=S.evalTasks||[];S.customAssets=S.customAssets||[];S.demandDraft=S.demandDraft||{};return S.evalTasks}
function demandCurrent(){return demandStore().find(t=>t.id===S.evalTaskId)||null}
function makeDemandTask(input={}){const list=demandStore();const id='EV-'+String(list.length+1).padStart(3,'0');const t={id,name:input.name||(input.goal?input.goal.slice(0,32):(input.object||'未命名对象')+' · 能力评测'),goal:input.goal||'',object:input.object||'',objectVersion:input.objectVersion||'',type:input.type||'待明确',source:input.source||'',assetMode:input.assetMode||'search',scope:'',success:'',budget:20,revision:1,stage:0,deps:[],events:[{actor:'林工',text:'仅依据当前需求或对象创建任务；尚未分析、绑定或发布任何依赖资产。'}],pilot:null,pilotHistory:[],confirmedRevision:0,manifest:null,manifests:[],runId:null,entryAsset:input.entryAsset||null};list.push(t);return t}
function demandTouch(t,reason){if(t.pilot)t.pilotHistory.push({...t.pilot,superseded:true});t.revision++;t.pilot=null;t.confirmedRevision=0;if(t.manifest){t.manifests.push(t.manifest);t.manifest=null}t.events.push({actor:roleNames[S.role],text:reason+'；方案更新为 r'+t.revision+'，重新核对试评、确认与冻结。'});log('评测任务方案修订',t.id+' / '+reason)}
function demandStatus(t){return t.runId?'已形成结果':t.manifest?'清单已冻结':t.confirmedRevision===t.revision?'待正式预检':t.pilot?'待试评确认':t.deps.length?'复用与补齐':'待分析'}
function demandCurrentAsset(d){return d.assetId?allAssets().find(a=>a.id===d.assetId&&a.version===d.assetVersion):null}
function demandState(d){if(d.excluded)return '已确认不适用';const a=demandCurrentAsset(d);return !a?'待补齐':a.status==='已发布'?'已发布':a.validated?'已校验候选':'候选草稿'}
function demandResolved(t,formal=false){return t.deps.length>0&&t.deps.every(d=>d.excluded?(d.exclusionActor==='陈专家'&&!!d.exclusionReason):(()=>{const a=demandCurrentAsset(d);return !!a&&d.compatible&&(formal?a.status==='已发布':a.status==='已发布'||a.validated)})())}
function newEvaluation(){demandStore();const d=S.demandDraft;const anchor=d.entryAsset?allAssets().find(a=>a.id===d.entryAsset):null;return head('新建评测','可以从一个评测需求或一个被测对象开始。创建任务时不需要已有资产、套件或模板。',btn('查看评测任务','go','tasks','','file'))+`<div class="hero mb"><div class="between"><div><div class="flex mb" style="margin-bottom:8px">${badge('需求 / 对象驱动','blue')}${badge('资产与模板可后续补齐','teal')}</div><h2>先说明想验证什么，再一起把评测准备好。</h2><p>平台在任务内分析数据、指标、参考答案、金标、评估器等依赖，并承接复用、建设和审核。</p></div>${btn('查看双向路径','df-paths','','','branch')}</div><div class="mini-steps">${demandStages.map((x,i)=>`<div class="mini-step"><b>${i+1}</b>${x}</div>`).join('')}</div></div><div class="split-small"><div class="stack">${section('从需求或对象创建任务',`<div class="pad stack"><div class="notice">${ic('file')}<div>下面“评测需求”和“被测对象”至少填写一项即可。对象版本、成功条件和依赖可以进入任务后继续明确。</div></div>${field('评测需求',`<textarea class="input" id="df-start-goal" placeholder="例如：验证新版本客服 Agent 的多轮任务完成与拒绝后的停止行为。">${esc(d.goal||'')}</textarea>`,'可以粘贴需求描述；暂时没有数据集、金标或评测方法也可以创建。')}${field('被测对象',`<input class="input" id="df-start-object" value="${esc(d.object||'')}" placeholder="例如：某个模型、Agent 或 RAG 应用名称 / 对象编号">`,'可以仅从一个对象发起，随后在任务内澄清目标与适用范围。')}<div class="grid2">${field('对象类型 · 可稍后明确',`<select class="input" id="df-start-type">${demandTypeOptions.map(x=>`<option ${d.type===x?'selected':''}>${x}</option>`).join('')}</select>`)}${field('对象版本 · 可稍后补充',`<input class="input" id="df-start-version" value="${esc(d.objectVersion||'')}" placeholder="版本、构建号或源系统引用">`)}</div><details><summary class="small muted" style="cursor:pointer">已有资料与资产准备情况 · 可选</summary><div class="stack mt">${field('需求链接 / 已有数据或文档',`<input class="input" id="df-start-source" value="${esc(d.source||'')}" placeholder="填写需求或评审记录链接、已有数据或文档版本；可留空">`)}${field('资产准备现状',`<select class="input" id="df-start-assets"><option value="search" ${d.assetMode!=='none'?'selected':''}>尚未梳理，任务内检索可复用资产</option><option value="none" ${d.assetMode==='none'?'selected':''}>暂无适用资产，从任务内建设</option></select>`)}</div></details>${anchor?`<div class="notice success">${ic('box')}<div>来自资产中心：${esc(anchor.name)} ${anchor.version}<br>仅作为候选引用，后续仍须确认用途、兼容性与其余缺口。${btn('移除引用','df-clear-anchor','','ghost sm')}</div></div>`:''}<div class="between wrap"><span class="small muted">创建的是评测任务，尚不启动运行。</span>${btn('创建评测任务','df-create','','primary','plus')}</div></div>`)}${section('继续已有评测任务',demandTaskTable(3),btn('全部任务','go','tasks','ghost sm'))}</div><div class="stack">${section('已有模板？可以快捷复用',`<div class="pad stack"><p class="small muted">模板帮助预填方案，是一种可选起点。没有匹配模板时，仍可直接创建评测任务。</p>${templates.map(t=>`<button class="template" style="padding:11px 13px" data-action="template" data-param="${t.id}"><div class="between"><span class="flex">${ic(t.icon)}<b class="small">${t.name}</b></span>${badge(t.category,'blue')}</div></button>`).join('')}</div>`)}${section('没有新需求，也能建设资产',`<div class="pad stack"><p class="small muted">围绕某个模型、Agent 或应用，持续建设数据、场景、用例、指标、参考答案与金标。</p><div class="flowbox"><b>候选 → 校验 → 独立审核 → 发布</b><span class="small muted">后续从资产详情发起任务，或被已有任务引用。</span></div>${btn('进入资产中心','go','assets','','box')}</div>`)}${section('体验两种尚无资产时开始评测',`<div class="pad stack">${btn('仅填一条需求','df-example','requirement','','file')}${btn('仅填一个对象','df-example','object','','box')}<span class="small muted">只填入合成示例，不自动生成、发布资产或启动任务。</span></div>`)}</div></div>`}
function demandTaskTable(limit=0){let list=[...demandStore()].reverse();if(limit)list=list.slice(0,limit);return list.length?table(['任务 / 起点','当前阶段','依赖准备',''],list.map(t=>[`<button class="linkbtn" data-action="df-open" data-param="${t.id}"><strong>${esc(t.name)}</strong></button><div class="subline">${t.id} · ${t.object?esc(t.object):'从需求起步 · 对象待明确'} · r${t.revision}</div>`,stateBadge(demandStatus(t)),t.deps.length?`${t.deps.filter(d=>d.excluded||demandState(d)==='已发布').length} / ${t.deps.length} 项`:'尚未分析',btn('继续','df-open',t.id,'sm')])):`<div class="empty">${ic('file')}<h3>尚未创建需求驱动的任务</h3>填写一个需求或对象即可开始；无需先创建任何资产。</div>`}
function demandTasks(){return head('评测任务','一个任务持续承接需求澄清、依赖建设、试评、正式运行与结果整理与复用。',btn('新建评测','go','new','primary','plus'))+section('需求与对象驱动的任务',demandTaskTable())+`<div class="grid2 mt">${section('任务与运行的区别',`<div class="pad stack"><div class="small">任务从需求或对象登记时就存在，资料不足时可以保持“待分析 / 待补齐”。</div><div class="small">正式运行在准备、试评、确认、资格与冻结全部满足后创建；完成后可派生下一轮任务，并保留原方案和结果。</div></div>`)}${section('独立资产建设',`<div class="pad stack"><p class="small muted">资产建设无需先有评测任务。已发布版本从详情直接发起新任务，也可加入已有任务的依赖。</p>${btn('查看对象资产','go','assets','','box')}</div>`)}</div>`}
function demandWorkspace(){const t=demandCurrent();if(!t)return demandTasks();const ready=t.deps.filter(d=>d.excluded||demandState(d)==='已发布').length;return head(esc(t.name),`${t.id} · ${t.object?esc(t.object):'对象待明确'} · 方案 r${t.revision} · ${demandStatus(t)}`,btn('任务列表','go','tasks','','arrowleft')+btn('导出任务记录','df-export','','','download')+(t.runId?btn('创建下一轮评测','df-derive','','primary','branch'):btn('编辑目标与范围','df-edit','','','file')))+`<div class="stepper">${demandStages.map((x,i)=>`<div class="step ${i===t.stage?'current':i<t.stage?'done':''}"><i>${i<t.stage?'✓':i+1}</i><button class="linkbtn steplabel" data-action="df-stage" data-param="${i}" style="color:inherit">${x}</button></div>`).join('')}</div><div class="card pad mb"><div class="between wrap"><div class="flex wrap">${badge(t.type,'blue')}<span class="small">${t.goal?esc(t.goal):'评测目标待澄清'}</span></div><div class="flex">${badge(t.deps.length?`依赖 ${ready} / ${t.deps.length}`:'尚无依赖清单',ready===t.deps.length&&ready?'teal':'orange')}${t.objectVersion?badge(t.objectVersion):badge('版本待补充','orange')}</div></div></div><div class="workspace-grid"><div class="stack">${t.stage===0?demandIntake(t):t.stage===1?demandDependencies(t):t.stage===2?demandPilot(t):t.stage===3?demandFormal(t):demandAftercare(t)}</div><div class="stack">${demandCollaboration(t)}${section('这一步需要什么',`<div class="pad stack"><div class="small muted">${['创建任务只要求需求或对象至少一项。AI 可以协助澄清；也可直接手动梳理依赖。','已有资产逐项确认可用；缺少的依赖在当前任务内创建候选、分派负责人并验证。','候选资产可以在受控开发范围试评。专家确认指标、参考、阈值和适用边界，试评不作为正式验收。','正式执行前检查所有适用依赖已发布、资格有效、版本明确、预算充足，冻结完整清单。','任务中的新数据、失败案例和缺证记录可整理为资产草稿，审核发布后供后续任务复用；已有发布资产可以被下一任务复用。'][t.stage]}</div><div class="divider"></div><div class="kv"><dt>创建任务</dt><dd>允许缺资产、缺模板、缺版本</dd><dt>正式运行</dt><dd>所有适用依赖、确认与冻结就绪</dd><dt>资产中心</dt><dd>治理主责保持不变；任务操作回写版本与引用</dd></div></div>`)}</div></div>`}
function demandIntake(t){return section('澄清本次评测范围',`<div class="pad stack"><div class="kv"><dt>需求 / 目标</dt><dd>${esc(t.goal)||'待与负责人明确'}</dd><dt>被测对象</dt><dd>${esc(t.object)||'待关联具体对象'}</dd><dt>对象版本</dt><dd>${esc(t.objectVersion)||'后续补齐，正式执行前固定'}</dd><dt>成功条件</dt><dd>${esc(t.success)||'待试评及业务 / 领域确认'}</dd><dt>来源</dt><dd>${esc(t.source)||'可后续添加需求链接、数据或文档引用'}</dd></div>${notice('当前资料不完整也可以继续分析。缺失信息会保留在任务内，不要求先去资产中心建完一套资产。','','file')}<div class="flex wrap">${btn('AI 梳理依赖建议','df-analyze','ai','primary','spark')}${btn('手动建立依赖清单','df-analyze','manual','','plus')}</div></div>`)}
function demandDependencies(t){return section('复用与补齐 · 本次任务依赖',`<div class="pad"><div class="between wrap mb"><div><h3>先确认“需要什么”，再落实到资产版本</h3><p class="small muted">${t.assetMode==='none'?'当前选择暂无适用资产，可以直接建设候选。':'检索仅提供候选匹配，不自动声明兼容或就绪。'} 参考答案与金标分别处理；清单是待确认建议，可追加依赖或由专家说明不适用。</p></div>${btn('追加依赖','df-add-dep','','sm','plus')}</div>${table(['依赖 / 用途','绑定版本 / 状态','责任人','操作'],t.deps.map(d=>{const a=demandCurrentAsset(d);return [`<strong>${esc(d.label)}</strong><div class="subline">${esc(d.description)}</div>`,`${stateBadge(demandState(d))}<div class="subline">${a?esc(a.name)+' · '+a.version:d.excluded?esc(d.exclusionReason):'尚未绑定'}</div>`,esc(d.owner),`<div class="flex wrap">${d.excluded?btn('恢复适用','df-restore',d.key,'sm'):btn(a?'查看 / 完善':'任务内补齐','df-dep-edit',d.key,'sm')}${btn('检索复用','df-dep-bind',d.key,'ghost sm')}${!d.excluded?btn('适用性','df-dep-scope',d.key,'ghost sm'):''}</div>`]}))}<div class="mt notice">${ic('box')}<div>任务内补齐会创建资产候选并带回当前依赖行。正式发布仍由资产中心规则与独立审核约束；无需离开任务反复建表。</div></div><div class="flex wrap mt">${btn('生成缺口的候选草稿','df-generate-candidates','','','spark')}${btn('校验任务候选','df-validate-candidates','','','check')}${btn('进入试评与确认','df-stage','2','primary','arrow')}</div></div>`,badge('任务内持续准备','blue'))}
function demandPilot(t){const resolved=demandResolved(t),p=t.pilot;return section('试评与确认',`<div class="pad stack"><div class="kv"><dt>开发依赖</dt><dd>${resolved?'适用依赖已绑定发布版本或有效候选':'仍有未绑定、未校验或未确认兼容的依赖'}</dd><dt>目标 / 对象 / 类型</dt><dd>${t.goal&&t.object&&t.type!=='待明确'?'已明确':'仍需补充评测目标、对象或类型'}</dd><dt>对象精确版本</dt><dd>${esc(t.objectVersion)||'待填写'}</dd><dt>成功条件</dt><dd>${esc(t.success)||'待填写指标、断言与门禁条件'}</dd></div><div class="flex wrap">${btn('补充目标与配置','df-edit','','sm','file')}${btn('返回依赖清单','df-stage','1','sm')}</div>${field('试评夹具（合成演示）',`<select class="input" id="df-pilot-fixture"><option value="valid">正例 / 违规测试样例 / 证据缺失测试样例均按预期判定</option><option value="missing">必要证据缺失，需补齐后重新试评</option><option value="wrong">错误评估器将违规测试样例判为 PASS</option></select>`)}<div>${btn('运行小样本试评','df-pilot-run','','primary','play')}</div>${p?`<div class="divider"></div><div class="between"><h3>试评 ${p.id} · 方案 r${p.revision}</h3>${badge(p.ready?'评测链路可用于确认':'需修正后重试',p.ready?'teal':'orange')}</div>${table(['夹具','预期判定','实际判定','链路检查'],[['正常业务结果','PASS',p.fixture==='missing'?'UNKNOWN':'PASS',p.fixture==='missing'?'缺证':'符合'],['已知违规结果','FAIL',p.fixture==='wrong'?'PASS':'FAIL',p.fixture==='wrong'?'错误误放行':'符合'],['必要证据缺失','UNKNOWN','UNKNOWN','符合']])}${notice('试评用于验证口径与评测链路；其中的业务 FAIL 负例按预期识别是正确行为。试评结果不作为产品正式通过证明。','','shield')}<div class="flex wrap">${t.confirmedRevision===t.revision?badge('当前方案已由领域专家确认','teal'):btn('专家确认试评口径','df-confirm','','','users')}${btn('进入正式评测准备','df-stage','3','primary','arrow')}</div>`:''}${t.pilotHistory.length?`<div class="small muted">保留 ${t.pilotHistory.length} 条过往试评记录；版本修改后的旧确认不可沿用。</div>`:''}</div>`)}
function demandFormalChecks(t){return [['对象与任务定义',!!t.goal&&!!t.object&&!!t.objectVersion&&t.type!=='待明确','目标、对象、类型与精确版本'],['成功条件与统计',!!t.success&&!!t.scope,'断言 / 门禁条件与适用范围'],['试评与专家确认',!!t.pilot?.ready&&t.confirmedRevision===t.revision,'绑定当前方案修订 r'+t.revision],['适用依赖已发布',demandResolved(t,true),'任务定义、数据、用例、指标、参考、评分方法、执行配置与通过条件'],['预算与当前模式',Number(t.budget)>=10&&!S.evolution.frozen,'演示预估 10 单位；冻结入口不能受理新运行']]}
function demandFormal(t){const checks=demandFormalChecks(t);return section('正式评测 · 运行前检查与版本固定',`<div class="pad stack">${table(['检查','状态','依据'],checks.map(([a,b,c])=>[a,badge(b?'满足':'待准备',b?'teal':'orange'),c]))}<div class="flex wrap">${btn('独立审核发布本任务候选','df-approve-assets','','','shield')}${btn('刷新预检','df-preflight','','','refresh')}</div>${t.manifest?`<div class="notice success">${ic('lock')}<div>已冻结 ${t.manifest.id} · 方案 r${t.manifest.revision}<br>对象、任务定义、套件及 ${t.manifest.dependencies.length} 项适用依赖均为精确版本。</div></div><div class="flex wrap">${btn('查看冻结清单','df-manifest','','','file')}${btn('启动正式评测演示','df-run','','primary','play')}</div>`:`${check('df-freeze-check','我已核对当前对象、范围、必测、依赖版本与预算。')}<div>${btn('确认并固定版本','df-freeze','','primary','lock')}</div>`}${notice('创建任务时允许缺资产；正式执行时必须满足全部适用依赖与资格。两者使用不同准入条件。','','file')}</div>`)}
function demandAftercare(t){const r=S.runs.find(r=>r.id===t.runId);return section('资产复用与持续回归',`<div class="pad stack">${r?`<div class="between"><div><h3>${r.id} · ${esc(r.name)}</h3><p class="small muted">对象 ${esc(r.build)} · 当前结果快照 r${r.snapshot}</p></div>${stateBadge(r.verdict)}</div><div class="flex wrap">${btn('查看运行与证据','open-run',r.id,'primary','eye')}${btn('创建下一轮评测','df-derive','','','refresh')}</div>`:notice('正式结果尚未形成。仍可单独建设、审核和发布当前对象的资产。','warn')}<div class="divider"></div>${table(['任务形成的资产','版本 / 状态','后续用途'],t.deps.filter(d=>d.assetId).map(d=>{const a=demandCurrentAsset(d);return [esc(d.label),a?`${a.version} · ${a.status}`:'引用待核对','资产中心可检索，供兼容任务复用']}))}<div class="flex wrap">${btn('到资产中心查看本任务成果','df-view-assets','','','box')}${btn('从结果建立回归候选','df-regression','','','plus')}</div>${t.followupAsset?notice('已生成回归候选 '+t.followupAsset+'。该候选须独立校验、审核与发布；不会自动改成正式资产。','success','file'):''}<div class="small muted">已发布版本保留原身份与内容。后续修订产生新版本，原运行快照与冻结清单保持不变。</div></div>`)}
function demandCollaboration(t){return section('同一任务内的人机协作',`<div class="pad"><div class="timeline" style="padding:0;max-height:350px">${t.events.slice(-7).map(e=>eventHTML(e.actor,e.text,e.actor.includes('助手')?'ai':'human')).join('')}</div><div class="divider"></div><textarea id="df-message" class="input" aria-label="任务讨论" placeholder="补充约束、讨论依赖或请专家澄清…"></textarea><div class="flex wrap mt">${btn('保存讨论','df-message','','sm','chat')}${btn('梳理建议','df-analyze','ai','sm','spark')}</div><div class="small muted mt">讨论、建议与正式确认独立。AI 不会因聊天直接发布资产或启动正式运行。</div></div>`,badge('S1 固定协作','blue'))}
function demandAssetReturn(){const t=demandCurrent();return t?`<div class="notice mb">${ic('arrowleft')}<div class="grow">当前关联评测任务 ${t.id} · ${esc(t.name)}。资产建设也可独立开展。</div>${btn('返回任务继续准备','df-open',t.id,'sm')}</div>`:''}
function demandRunReturn(id){const t=demandStore().find(t=>t.id===(id||S.evalTaskId));return t?`<div class="notice mb">${ic('file')}<div class="grow">评测任务 ${t.id} · 从需求 / 对象开始，准备、试评和正式结果在同一任务中关联。</div>${btn('返回评测任务','df-open',t.id,'sm')}</div>`:''}
