name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Import verified Sites V23 snapshot
        if: ${{ hashFiles('dist/index.html') == '' }}
        run: |
          echo 'b21e1e8844582eddd3897dd01ed356cf94d4df07b1256ca75d1a99204299635c  sites-v23-bootstrap.zip' | sha256sum --check
          unzip -o sites-v23-bootstrap.zip
          python scripts/import-sites-snapshot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist docs tests scripts migration README.md .openai/hosting.json
          git rm sites-v23-bootstrap.zip
          git commit -m "Import complete Sites V23 snapshot with verified SHA-256 checksums"
          git push origin HEAD:main
      - name: Test shared UI and lifecycle logic
        run: node --test tests/*.test.cjs
      - name: Prepare portable static routes
        run: python scripts/prepare-pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
