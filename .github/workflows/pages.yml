name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Import local Sites V23 snapshot
        if: ${{ hashFiles('dist/index.html') == '' }}
        run: |
          cat sites-v23-chunk-*.bin > /tmp/sites-v23-source.tar.gz
          echo '74d96665baf73d6fdb2d6bbe1183924a7161908b651c8c450a8c5a1eb492fbd9  /tmp/sites-v23-source.tar.gz' | sha256sum --check
          tar -xzf /tmp/sites-v23-source.tar.gz
          python - <<'PYVERIFY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('migration/sites-v23-manifest.json').read_text())
          for item in manifest['files']:
              data = Path(item['path']).read_bytes()
              assert len(data) == item['bytes'], item['path']
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
          print(f"Verified all {len(manifest['files'])} original files; historical evidence unchanged.")
          PYVERIFY
      - name: Test shared UI and lifecycle logic
        run: node --test tests/*.test.cjs
      - name: Prepare portable static routes
        run: python scripts/prepare-pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
